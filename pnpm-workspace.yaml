allowBuilds:
    "@parcel/watcher": true
    sharp: true
    simple-git-hooks@2.14.0: true
    unrs-resolver: true

configDependencies:
    "@obusk/pnpm-plugin-defaults": ~12.19.0

minimumReleaseAgeExclude:
    - next
    - "@next/*"
    - eslint-config-next
    - "@obusk/eslint-config-next"
    - "@obusk/pnpm-plugin-defaults"

overrides:
    "@types/react": 19.2.18
    "@types/react-dom": 19.2.5

trustPolicyExclude:
    - eslint-import-resolver-typescript@3.10.1
    - semver@6.3.1
